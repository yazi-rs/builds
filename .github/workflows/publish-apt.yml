name: Publish APT repository

on:
  repository_dispatch:
    types: [publish-apt]
  workflow_dispatch:

concurrency:
  group: apt-repository
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: APT
    steps:
      - uses: actions/checkout@v7

      - name: Install APT tools
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Build repository
        env:
          APT_SIGNING_FINGERPRINT: ${{ secrets.APT_SIGNING_FINGERPRINT }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-apt site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
